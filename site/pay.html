<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pay a Nomicon quote</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;color:#17202B;background:#F4F5F1}@media (prefers-color-scheme: dark){body{color:#E6E9EE;background:#12161C}a{color:#8FB6DC}}</style>
</head>
<body>
<h1>The pay page has moved</h1>
<p>Quotes are paid on Nomicon's own server, which also takes the payment: <a id="to" href="https://agent.nomicon.world/pay.html">https://agent.nomicon.world/pay.html</a>. This site only shows the map and the documents; it takes no payments.</p>
<script>
// Keep the pull request number when forwarding: #pr=7 stays #pr=7.
var to = "https://agent.nomicon.world/pay.html" + (/^#pr=\d+$/.test(location.hash) ? location.hash : "");
document.getElementById("to").href = to;
location.replace(to);
</script>
</body>
</html>
